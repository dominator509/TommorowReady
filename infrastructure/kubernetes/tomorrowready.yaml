apiVersion: v1
kind: ServiceAccount
metadata:
  name: tomorrowready
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: tomorrowready-api
spec:
  selector: { app: tomorrowready-api }
  ports: [{ name: http, port: 4000, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: tomorrowready-web
spec:
  selector: { app: tomorrowready-web }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomorrowready-api
  labels: { environment: local-rehearsal }
spec:
  replicas: 2
  selector:
    matchLabels: { app: tomorrowready-api }
  template:
    metadata:
      labels: { app: tomorrowready-api }
    spec:
      serviceAccountName: tomorrowready
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: tomorrowready-api@sha256:a02406d473db46b90d89f6d45d887ea071b036451eae0d96f7f77116fa7dcfdc
          imagePullPolicy: Never
          ports: [{ name: http, containerPort: 4000 }]
          envFrom: [{ secretRef: { name: tomorrowready-runtime } }]
          readinessProbe:
            { httpGet: { path: /health/ready, port: http }, periodSeconds: 5, failureThreshold: 6 }
          livenessProbe:
            { httpGet: { path: /health/live, port: http }, periodSeconds: 10, failureThreshold: 3 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: '1', memory: 1Gi } }
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: ['ALL'] },
            }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomorrowready-worker
  labels: { environment: local-rehearsal }
spec:
  replicas: 2
  selector:
    matchLabels: { app: tomorrowready-worker }
  template:
    metadata:
      labels: { app: tomorrowready-worker }
    spec:
      serviceAccountName: tomorrowready
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: tomorrowready-worker@sha256:9f9385ee3e48afeea7b0185c9087eb10550bde306161624155bc615e6ba24866
          imagePullPolicy: Never
          envFrom: [{ secretRef: { name: tomorrowready-runtime } }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: '1', memory: 1Gi } }
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: ['ALL'] },
            }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tomorrowready-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomorrowready-web
  labels: { environment: local-rehearsal }
spec:
  replicas: 2
  selector:
    matchLabels: { app: tomorrowready-web }
  template:
    metadata:
      labels: { app: tomorrowready-web }
    spec:
      serviceAccountName: tomorrowready
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: tomorrowready-web@sha256:40379c2e3ab55fe0184d5087b7b51acc7f7aea2a55b2c13fe0488d9577467295
          imagePullPolicy: Never
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe:
            { httpGet: { path: /, port: http }, periodSeconds: 5, failureThreshold: 6 }
          livenessProbe:
            { httpGet: { path: /, port: http }, periodSeconds: 10, failureThreshold: 3 }
          resources:
            { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: '500m', memory: 512Mi } }
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: ['ALL'] },
            }
